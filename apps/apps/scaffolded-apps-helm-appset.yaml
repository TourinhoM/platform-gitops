# Discovery Helm: ApplicationSets scaffolded-apps-helm-env e -helm-kargo para consumer charts Helm.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: scaffolded-apps-helm-env
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - scmProvider:
              cloneProtocol: https
              requeueAfterSeconds: 600
              github:
                organization: tourinho-labs
                tokenRef:
                  secretName: github-scm-token
                  key: token
              filters:
                - repositoryMatch: ^gitops-
                  pathsExist: [Chart.yaml]
          # git FILES sobre os arquivos de image; 1 param-set por env ativo.
          - git:
              repoURL: "{{ .url }}"
              revision: "{{ .branch }}"
              files:
                - path: "values/*.image.yaml"
  template:
    metadata:
      # <app>-<env>: env = nome do arquivo sem ".image.yaml".
      name: "{{ trimPrefix \"gitops-\" .repository }}-{{ trimSuffix \".image.yaml\" .path.filename }}"
      labels:
        app: "{{ trimPrefix \"gitops-\" .repository }}"
    spec:
      project: scaffolded-apps
      source:
        repoURL: "{{ .url }}"
        targetRevision: "{{ .branch }}"
        path: .
        helm:
          # Release name = <app> sem sufixo de env.
          releaseName: "{{ trimPrefix \"gitops-\" .repository }}"
          # Camada last-wins: base + delta do dev + image do Kargo.
          valueFiles:
            - values.yaml
            - "values/{{ trimSuffix \".image.yaml\" .path.filename }}.yaml"
            - "{{ .path.path }}/{{ .path.filename }}"
          # Injeta host da plataforma (global.ambiente e global.dominioPlataforma).
          parameters:
            - name: global.ambiente
              value: "{{ trimSuffix \".image.yaml\" .path.filename }}"
            - name: global.dominioPlataforma
              value: "plataforma.example.com"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ trimPrefix \"gitops-\" .repository }}-{{ trimSuffix \".image.yaml\" .path.filename }}"
      # Ignora /spec/replicas (gerenciado pelo HPA).
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 15
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: scaffolded-apps-helm-kargo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - scmProvider:
        cloneProtocol: https
        requeueAfterSeconds: 600
        github:
          organization: tourinho-labs
          tokenRef:
            secretName: github-scm-token
            key: token
        filters:
          - repositoryMatch: ^gitops-
            pathsExist: [kargo]
  template:
    metadata:
      name: "{{ trimPrefix \"gitops-\" .repository }}-kargo"
      labels:
        app: "{{ trimPrefix \"gitops-\" .repository }}"
    spec:
      project: scaffolded-apps
      source:
        repoURL: "{{ .url }}"
        targetRevision: "{{ .branch }}"
        path: kargo
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ trimPrefix \"gitops-\" .repository }}"
      # Campos que o webhook do ESO / controller do Kargo preenchem com
      # defaults que o git não declara — sem isso fica OutOfSync pra sempre.
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - '.spec.data[].remoteRef.conversionStrategy'
            - '.spec.data[].remoteRef.decodingStrategy'
            - '.spec.data[].remoteRef.metadataPolicy'
            - '.spec.data[].remoteRef.nullBytePolicy'
            - '.spec.target.deletionPolicy'
        - group: kargo.akuity.io
          kind: Stage
          jqPathExpressions:
            - '.spec.requestedFreight[].sources.requiredSoakTime'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true   # CRDs grandes do Kargo (Stage/Warehouse)
          - RespectIgnoreDifferences=true
        managedNamespaceMetadata:
          labels:
            kargo.akuity.io/project: "true"
