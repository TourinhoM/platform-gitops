apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: scaffolded-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Matrix: 1 Application por (repo gitops-<app>, overlay) → <app>-<env>.
    - matrix:
        generators:
          - scmProvider:
              # https → .url devolve clone URL HTTPS (repo público, sem chave SSH).
              cloneProtocol: https
              requeueAfterSeconds: 600
              github:
                organization: tourinho-labs
                tokenRef:
                  secretName: github-scm-token
                  key: token
              filters:
                # Filtra repos gitops-* com overlays/.
                - repositoryMatch: ^gitops-
                  pathsExist: [overlays]
          # repoURL/revision vêm dos params do scmProvider (matrix passa adiante).
          - git:
              repoURL: "{{ .url }}"
              revision: "{{ .branch }}"
              directories:
                - path: overlays/*
  template:
    metadata:
      # <app>-<env>: app sem prefixo gitops-, env = basename do overlay.
      name: "{{ trimPrefix \"gitops-\" .repository }}-{{ .path.basename }}"
      labels:
        app: "{{ trimPrefix \"gitops-\" .repository }}"
    spec:
      project: scaffolded-apps
      source:
        repoURL: "{{ .url }}"
        targetRevision: "{{ .branch }}"
        # overlays/<env>: cada App sincroniza um overlay.
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        # ns = <app>-<env>; a claim AppNamespace (em default) cria esse ns com a cerca.
        namespace: "{{ trimPrefix \"gitops-\" .repository }}-{{ .path.basename }}"
      # Ignora /spec/replicas (gerenciado pelo HPA).
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 15
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
