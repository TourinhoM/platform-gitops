apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-policy-reporter
  namespace: argocd
  annotations:
    # Wave 1: depois do Kyverno.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: system

  source:
    repoURL: https://kyverno.github.io/policy-reporter/
    chart: policy-reporter
    targetRevision: 3.7.4
    helm:
      values: |
        # UI do Policy Reporter exposta em https://policy-reporter.local.
        ui:
          enabled: true
          ingress:
            enabled: true
            className: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
              cert-manager.io/cluster-issuer: ca-issuer
            hosts:
              - host: policy-reporter.local
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - hosts:
                  - policy-reporter.local
                secretName: policy-reporter-tls

        # REST API consumida pelo plugin do Backstage.
        rest:
          enabled: true

        # Subchart do Kyverno: expõe detalhes de policy.
        plugin:
          kyverno:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: policy-reporter

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
