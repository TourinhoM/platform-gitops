apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-policy-reporter
  namespace: argocd
  annotations:
    # Wave 1 = depois do Kyverno (wave 0), que precisa existir p/
    # gerar os CRDs PolicyReport que o Policy Reporter agrega.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: system

  source:
    repoURL: https://kyverno.github.io/policy-reporter/
    chart: policy-reporter
    targetRevision: 3.7.4
    helm:
      values: |
        # UI propria do Policy Reporter (dashboard de PolicyReports,
        # ao lado do trivy-operator/dtrack), exposta em
        # https://policy-reporter.local (Traefik + cert-manager).
        # O secret TLS e criado pelo ingress-shim do cert-manager
        # (annotation cluster-issuer: ca-issuer), padrao dtrack/vault.
        ui:
          enabled: true
          ingress:
            enabled: true
            className: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
              cert-manager.io/cluster-issuer: ca-issuer
            hosts:
              - host: policy-reporter.local
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - hosts:
                  - policy-reporter.local
                secretName: policy-reporter-tls

        # REST API: e isto que o plugin do Backstage consome.
        # In-cluster: http://policy-reporter.policy-reporter.svc:8080
        rest:
          enabled: true

        # Subchart do Kyverno: expoe detalhes de policy (blockReports
        # etc.). Necessario p/ o plugin oficial @kyverno/* ligar os
        # reports as policies de origem.
        plugin:
          kyverno:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: policy-reporter

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
