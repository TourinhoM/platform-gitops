apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-kyverno
  namespace: argocd
  annotations:
    # Wave 0: chart e CRDs primeiro.
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: system

  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.1
    helm:
      values: |
        # Controllers: admission, background e reports habilitados.
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        reportsController:
          replicas: 1

        # cleanup-controller desabilitado.
        cleanupController:
          enabled: false

        # Força failurePolicy=Ignore em todos os webhooks.
        features:
          forceFailurePolicyIgnore:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
