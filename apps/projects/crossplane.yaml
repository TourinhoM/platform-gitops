apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: crossplane
  namespace: argocd
spec:
  description: Domínio Crossplane — runtime (core, providers, providerconfigs, rbac) em platform-crossplane
  # sourceRepos/destinations apertados.
  sourceRepos:
    - https://charts.crossplane.io/stable                # chart do Crossplane core
    - https://github.com/TourinhoM/platform-crossplane   # providers/providerconfigs/rbac do domínio
  destinations:
    - namespace: crossplane-system
      server: https://kubernetes.default.svc
    - namespace: argocd                                  # leaves (Application) vivem em argocd
      server: https://kubernetes.default.svc
  # Whitelist cluster-wide para os CRDs que o Crossplane instala em runtime.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
