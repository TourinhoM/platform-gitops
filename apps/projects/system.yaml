apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: system
  namespace: argocd
spec:
  description: Substrato do cluster — Argo CD self-management, External Secrets, Keycloak Operator, cert-manager, Kyverno, policy-reporter, Trivy Operator
  # sourceRepos/destinations escopados ao que os apps de `system` realmente usam.
  # (crossplane/apis saíram p/ projects próprios; dtrack/vault/backstage vivem em security/backstage.)
  sourceRepos:
    - https://github.com/TourinhoM/platform-gitops       # argocd self/config, external-secrets-config
    - https://github.com/TourinhoM/platform-network      # cert-manager-config (era deploy-cert-manager)
    - https://charts.external-secrets.io                 # External Secrets Operator
    - https://charts.jetstack.io                         # cert-manager
    - https://aquasecurity.github.io/helm-charts/        # Trivy Operator
    - https://kyverno.github.io/kyverno/                 # Kyverno + policies
    - https://kyverno.github.io/policy-reporter/         # policy-reporter
    - https://github.com/keycloak/keycloak-k8s-resources # Keycloak Operator
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: keycloak
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: trivy-system
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: policy-reporter
      server: https://kubernetes.default.svc
  # Cluster amplo por natureza do substrato: estes operators instalam CRDs,
  # ClusterRoles e webhooks (cert-manager, ESO, Kyverno, Trivy, Keycloak Operator).
  # Enumerar seria frágil; o fence real vive em sourceRepos + destinations.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
