apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 1.0.16
    helm:
      values: |
        reloader:
          # annotations (não env-vars): o marcador de reload vira UMA annotation
          # estável no pod template — fácil de ignorar no Argo (ignoreDifferences
          # no ApplicationSet) sem listar env vars injetadas.
          reloadStrategy: annotations
          # CRIAÇÃO de Secret/CM rastreado também rola o pod (default só
          # update) — caso real: capability nova entrega db-conn que não
          # existia; sem isto o pod fica cego até alguém tocar o Secret.
          reloadOnCreate: true
          # Só workloads anotados (reloader.stakater.com/auto no app-base) —
          # mudança em Secret/ConfigMap consumido rola o pod sozinho. É o que
          # faz capability nova (db-conn) e edição de env.properties chegarem
          # ao container sem bump manual de revisão nos templates day-2.
          watchGlobally: true
          deployment:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
