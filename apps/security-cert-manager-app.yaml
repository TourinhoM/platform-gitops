apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-cert-manager
  namespace: argocd
  annotations:
    # Wave 0: chart e CRDs primeiro.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: system

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.18.2
    helm:
      values: |
        crds:
          enabled: true
          keep: true
        replicaCount: 1
        webhook:
          replicaCount: 1
        cainjector:
          replicaCount: 1
        global:
          leaderElection:
            namespace: cert-manager
        # Prometheus annotations + ServiceMonitor para o kube-prometheus-stack.
        prometheus:
          enabled: true
          servicemonitor:
            enabled: true
            labels:
              release: monitoring

        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
