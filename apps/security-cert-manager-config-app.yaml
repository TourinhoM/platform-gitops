apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-cert-manager-config
  namespace: argocd
  annotations:
    # Wave 1: depois dos CRDs do chart (wave 0).
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: system

  source:
    repoURL: https://github.com/TourinhoM/platform-network
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    # ClusterIssuer é cluster-scoped; workloads declaram namespace próprio.
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
