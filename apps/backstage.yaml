apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.8.0
    helm:
      values: |
        backstage:
          image:
            registry: ghcr.io
            repository: tourinhom/platform-backstage
            tag: 1.7.0
          extraEnvVarsSecrets:
            - backstage-secrets
          appConfig:
            app:
              title: Platform Lab
              baseUrl: https://backstage.local
              packages: all
              extensions:
                - page:catalog:
                    config:
                      path: /
            organization:
              name: TourinhoM
            backend:
              baseUrl: https://backstage.local
              listen:
                port: 7007
              csp:
                connect-src: ["'self'", 'http:', 'https:']
              cors:
                origin: https://backstage.local
                methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
                credentials: true
              database:
                client: pg
                connection:
                  host: postgresql.infra.svc.cluster.local
                  port: 5432
                  user: backstage
                  password: ${POSTGRES_PASSWORD}
                  database: backstage
            integrations:
              github:
                - host: github.com
                  token: ${GITHUB_TOKEN}
            auth:
              environment: production
              providers:
                guest:
                  dangerouslyAllowOutsideDevelopment: true
                github:
                  production:
                    clientId: ${GITHUB_CLIENT_ID}
                    clientSecret: ${GITHUB_CLIENT_SECRET}
                    signIn:
                      resolvers:
                        - resolver: usernameMatchingUserEntityName
                          dangerouslyAllowSignInWithoutUserInCatalog: true
            catalog:
              import:
                entityFilename: catalog-info.yaml
                pullRequestBranchName: backstage-integration
              rules:
                - allow: [Component, System, API, Resource, Location, Group, User, Template]
              providers:
                github:
                  TourinhoM:
                    organization: TourinhoM
                    catalogPath: /catalog-info.yaml
                    filters:
                      branch: main
                    schedule:
                      frequency: { minutes: 30 }
                      timeout: { minutes: 3 }
            argocd:
              appLocatorMethods:
                - type: config
                  instances:
                    - name: homelab
                      url: http://argocd-server.argocd.svc
                      username: admin
                      password: ${ARGOCD_ADMIN_PASSWORD}
            permission:
              enabled: true

            proxy:
              endpoints:
                '/grafana/api':
                  target: http://monitoring-grafana.monitoring.svc
                  headers:
                    Authorization: Bearer ${GRAFANA_TOKEN}

            techdocs:
              builder: 'local'
              generator:
                runIn: 'local'
              publisher:
                type: 'local'

            kubernetes:
              serviceLocatorMethod:
                type: multiTenant
              clusterLocatorMethods:
                - type: config
                  clusters:
                    - name: homelab
                      url: https://kubernetes.default.svc
                      authProvider: serviceAccount

            grafana:
              domain: https://grafana.local
              unifiedAlerting: true

        postgresql:
          enabled: false

        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
          host: backstage.local
          tls:
            enabled: true
            secretName: backstage-tls

  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 15
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
