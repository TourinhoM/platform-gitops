# Pointer app-of-apps → sincroniza platform-promotion/apps (controller Kargo +
# argo-rollouts + kargo-resources). Mesmo padrão do monitoring-app. Os apps
# aninhados usam o AppProject `promotion`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promotion-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: app-of-apps
  source:
    repoURL: https://github.com/TourinhoM/platform-promotion.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
