# Merge sobre o HelmChart nativo do k3s (addon traefik) — soma no
# valuesContent existente, não substitui. Habilita tracing OTLP nativo
# do Traefik v3. Validado com `helm template` contra o chart exato
# empacotado no k3s (traefik-40.1.3+up40.1.0.tgz) antes de aplicar.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    tracing:
      otlp:
        enabled: true
        grpc:
          enabled: true
          endpoint: "otel-gateway.monitoring.svc.cluster.local:4317"
          insecure: true
