apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-backstage-token-sync
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-backstage-token-sync
  namespace: argocd
rules:
  # Só pra ler a senha inicial do admin uma vez, no primeiro login pra mintar
  # o token da conta backstage. Se o secret já tiver sido rotacionado/removido
  # manualmente, o Job falha e precisa ser rerodado logo após um bootstrap novo.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-initial-admin-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-backstage-token-sync
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-backstage-token-sync
subjects:
  - kind: ServiceAccount
    name: argocd-backstage-token-sync
    namespace: argocd
