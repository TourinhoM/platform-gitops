# Ingress placeholder para a UI do Argo CD.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # Expor tanto em HTTP quanto HTTPS no Traefik.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # Backend do Argo CD deve ser HTTP quando server.insecure=true.
    traefik.ingress.kubernetes.io/service.serversscheme: http
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd.local
      secretName: keycloak-tls

  rules:
    - host: argocd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
  # TODO: adicionar TLS.

