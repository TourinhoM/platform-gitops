# Polaris exemptions per-resource para os dangers de RBAC do Argo CD.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-application-controller
  annotations:
    polaris.fairwinds.com/clusterrolebindingClusterAdmin-exempt: "true"
    polaris.fairwinds.com/clusterrolebindingPodExecAttach-exempt: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-server
  annotations:
    polaris.fairwinds.com/clusterrolebindingPodExecAttach-exempt: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-application-controller
  annotations:
    polaris.fairwinds.com/clusterrolePodExecAttach-exempt: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-server
  annotations:
    polaris.fairwinds.com/clusterrolePodExecAttach-exempt: "true"
