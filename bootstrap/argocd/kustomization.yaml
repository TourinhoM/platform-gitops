apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Bootstrap do Argo CD via manifests oficiais (versão pinada).

namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.2/manifests/install.yaml
  - ingress.yaml
  - externalsecret-argocd-oidc.yaml
  - certificate-argocd.yaml

patches:
  - path: argocd-cmd-params-cm-patch.yaml
  - path: argocd-cm-patch.yaml
  - path: argocd-rbac-cm-patch.yaml
  - path: resources-patch.yaml
  - path: polaris-rbac-exempt-patch.yaml

