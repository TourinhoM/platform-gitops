# Argo CD ignora campos gerenciados pelo field-manager kyverno.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: https://argocd.local
  oidc.config: |
    name: Keycloak
    issuer: https://keycloak.local/keycloak/realms/kubernetes
    clientID: argocd
    clientSecret: $argocd-oidc-secret:oidc.keycloak.clientSecret
    requestedScopes: ["openid", "profile", "email", "groups"]
  resource.customizations.ignoreDifferences.apps_Deployment: |
    managedFieldsManagers:
      - kyverno
  resource.customizations.ignoreDifferences.apps_StatefulSet: |
    managedFieldsManagers:
      - kyverno
  resource.customizations.ignoreDifferences.apps_DaemonSet: |
    managedFieldsManagers:
      - kyverno
  resource.customizations.ignoreDifferences.batch_Job: |
    managedFieldsManagers:
      - kyverno
  resource.customizations.ignoreDifferences.batch_CronJob: |
    managedFieldsManagers:
      - kyverno
